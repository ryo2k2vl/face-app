<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Face Recognize App</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      text-align: center;
      background: #ffeaea;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      transition: background 0.4s;
    }

    /* じわじわ濃くなるアニメ（1回再生） */
    body.love {
      animation: glow 1s ease-out forwards;
    }
    
    /* アニメ後に5秒固定される濃ピンク */
    body.love-fixed {
      background: #ff7fc9; /* ← 濃いピンク固定 */
    }
    
    h2 {
      margin: 10px 0 2px 0;
      font-size: 1.6em;
    }

    /* カメラと画像共通の領域 */
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 5px auto 0 auto;
    }

    video, #uploadedImage, canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      transform: scaleX(-1);
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* 状態テキスト */
    #status {
      font-size: 1.3em;
      min-height: 1.4em;
      margin-top: 10px;
    }

    /* popup */
    #popup {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 22px 40px;
      font-size: 2em;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      border: 2px solid rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 9999;
    }

    #popup.show {
      opacity: 1;
    }

    /* スマホ音声解除ボタン */
    #startButton {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8em;
      padding: 18px 36px;
      z-index: 99999;
      background: #ff8a8a;
      color: white;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 右上 画像選択ボタン */
    #selectImageBtn {
      position: fixed;
      top: 8px;
      right: 8px;
      padding: 10px 14px;
      font-size: 1em;
      border-radius: 10px;
      border: none;
      background: #ff8cb8;
      color: white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      z-index: 9999;
    }

  </style>
</head>

<body>

  <h2>Face Recognize App</h2>

  <!-- スマホ用音声許可 -->
  <button id="startButton">▶ タップして開始</button>

  <!-- 右上：画像選択ボタン -->
  <button id="selectImageBtn">🖼画像を選択</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none">

  <div class="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <img id="uploadedImage">
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">モデル読み込み中...</div>
  <div id="popup"></div>

  <script>
    const video = document.getElementById("video");
    const uploadedImage = document.getElementById("uploadedImage");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");

    const statusDiv = document.getElementById("status");
    const popup = document.getElementById("popup");
    const startButton = document.getElementById("startButton");
    const selectImageBtn = document.getElementById("selectImageBtn");
    const imgInput = document.getElementById("imgInput");

    let refRyo = null, refTowa = null;
    let cooldown = false;
    let lastState = "none";

    /* ==========================================================
        1. サウンド（pinpon）
    ========================================================== */
    const pinpon = new Audio("./sounds/pinpon.mp3");
    pinpon.preload = "auto";

    startButton.addEventListener("click", () => {
      // スマホ用：ユーザー操作で音声権限取得
      pinpon.play().catch(()=>{});
      pinpon.pause();
      pinpon.currentTime = 0;

      video.muted = false;
      startButton.style.display = "none";
    });

    /* ==========================================================
        2. UI ロック（5秒）
    ========================================================== */
    function lockUI() {
      cooldown = true;
    
      // love-fixed は（アニメ終了時）animationend でつくのでここでは付けない
    
      setTimeout(() => {
        cooldown = false;
        document.body.classList.remove("love-fixed");
        popup.classList.remove("show");
      }, 5000);
    }

    /* ==========================================================
        3. モデル読み込み
    ========================================================== */
    async function loadAll() {
      statusDiv.textContent = "モデル読み込み中...";
      await faceapi.nets.ssdMobilenetv1.loadFromUri("./models");
      await faceapi.nets.faceLandmark68Net.loadFromUri("./models");
      await faceapi.nets.faceRecognitionNet.loadFromUri("./models");

      refRyo = await (await fetch("ryo.json")).json();
      refTowa = await (await fetch("toto.json")).json();

      statusDiv.textContent = "開始できます";
    }

    /* ==========================================================
        4. カメラ起動
    ========================================================== */
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user", width:{ideal:640}, height:{ideal:480} }
      });

      video.srcObject = stream;

      return new Promise(res=>{
        video.onloadedmetadata = ()=>{
          video.play();
          video.style.display="block";
          res();
        };
      });
    }

    /* ==========================================================
        5. 共通：距離関数
    ========================================================== */
    function distance(a,b){
      return Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
    }

    /* ==========================================================
        6. popup 表示
    ========================================================== */
    function popupMsg(txt){
      popup.textContent = txt;
      popup.classList.add("show");
    }

    /* ==========================================================
        7. ラベル判定 + 描画
    ========================================================== */
    // glowアニメが終わったら濃いピンクを5秒固定
    document.body.addEventListener("animationend", (e) => {
      if (e.animationName === "glow") {
        document.body.classList.remove("love");       // アニメ終了
        document.body.classList.add("love-fixed");    // 濃ピンク固定へ移行
      }
    });

    
    function processDetections(detections){

      let foundRyo=false, foundTowa=false, unknownCount=0;

      ctx.clearRect(0,0,overlay.width,overlay.height);
      ctx.save();
      ctx.scale(-1,1);
      ctx.translate(-overlay.width,0);

      detections.forEach(det=>{
        const b = det.detection.box;
        const dx = overlay.width - (b.x + b.width);
        const dy = b.y;

        const desc = Array.from(det.descriptor);
        const dR = distance(desc, refRyo);
        const dT = distance(desc, refTowa);

        let label="", color="";

        if(dR < 0.35){
          label="ryo"; color="blue"; foundRyo=true;
        }else if(dT < 0.35){
          label="towa"; color="green"; foundTowa=true;
        }else{
          label="？"; color="gray"; unknownCount++;
        }

        ctx.strokeStyle=color;
        ctx.lineWidth=4;
        ctx.strokeRect(dx,dy,b.width,b.height);

        ctx.fillStyle=color;
        ctx.font="24px sans-serif";
        ctx.fillText(label, dx+5, dy-6);
      });

      ctx.restore();

      return {foundRyo,foundTowa,unknownCount};
    }

    /* ==========================================================
        8. 状態遷移
    ========================================================== */
    function handleState(r) {
      if(cooldown) return;

      let state="none";
      let txt="";

      if(r.foundRyo && r.foundTowa){
        state="couple";
        txt="💚 お似合いカップル！";
      }
      else if((r.foundRyo || r.foundTowa) && r.unknownCount > 0){
        state="mismatch";
        txt="💔 不似合いカップル…";
      }
      else if(r.foundRyo && !r.foundTowa){
        state="need_towa"; txt="あと とわ！";
      }
      else if(!r.foundRyo && r.foundTowa){
        state="need_ryo"; txt="あと りょう！";
      }
      else if(r.unknownCount>0){
        state="unknown"; txt="誰？";
      }

      if(state !== lastState){
        lastState = state;

        lockUI();
        popupMsg(txt);
        statusDiv.innerHTML = `<span>${txt}</span>`;

        if(state === "couple"){
            document.body.classList.add("love");   // ← アニメ開始
            pinpon.currentTime = 0;
            pinpon.play();
        }
      }
    }

    /* ==========================================================
        9. カメラループ
    ========================================================== */
    async function cameraLoop(){
      const det = await faceapi
        .detectAllFaces(video)
        .withFaceLandmarks()
        .withFaceDescriptors();

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;

      const r = processDetections(det);
      handleState(r);

      requestAnimationFrame(cameraLoop);
    }

    /* ==========================================================
        10. 画像選択
    ========================================================== */

    selectImageBtn.onclick = ()=> imgInput.click();

    imgInput.onchange = ()=>{
      const file = imgInput.files[0];
      if(!file) return;

      const url = URL.createObjectURL(file);
      uploadedImage.src = url;
      uploadedImage.style.display = "block";
      video.style.display="none";

      uploadedImage.onload = async ()=>{
        overlay.width = uploadedImage.width;
        overlay.height = uploadedImage.height;

        const det = await faceapi
          .detectAllFaces(uploadedImage)
          .withFaceLandmarks()
          .withFaceDescriptors();

        const r = processDetections(det);
        handleState(r);
      };
    };

    /* ==========================================================
        11. 初期化
    ========================================================== */
    (async()=>{
      await loadAll();
      await setupCamera();
      cameraLoop();
    })();

  </script>

</body>
</html>
