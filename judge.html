<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Face Recognize App (Full Integration)</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      text-align: center;
      background: #ffeaea;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none;
      transition: background 0.5s;
    }

    /* ---- アンビエント光 ---- */
    body.love {
      animation: glow 1.2s ease-out forwards;
    }
    @keyframes glow {
      0% { background: #ffeaea; }
      50% { background: #ffb3d9; }
      100% { background: #ffeaea; }
    }

    h2 {
      margin-top: 10px;
      font-size: 1.6em;
    }

    /* ---- カメラ ---- */
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 10px auto;
    }

    video, canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      transform: scaleX(-1); /* 鏡反転 */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #status {
      font-size: 1.4em;
      margin-top: 8px;
      min-height: 1.4em;
    }

    /* ---- ポップアップ ---- */
    #popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      padding: 20px 40px;
      font-size: 2em;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(0,0,0,0.2);
      transition: transform 0.35s ease-out, opacity 0.35s;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    #popup.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* ---- Start ボタン ---- */
    #startButton {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8em;
      padding: 18px 36px;
      z-index: 99999;
      border: none;
      border-radius: 14px;
      background: #ff8a8a;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* ---- スマホ向けフォント縮小 ---- */
    @media (max-width: 480px) {
      h2 { font-size: 1.3em; }
      #status { font-size: 1.1em; }
      #popup {
        font-size: 1.5em;
        padding: 14px 28px;
      }
      #startButton {
        font-size: 1.4em;
        padding: 16px 28px;
      }
    }
  </style>
</head>

<body>
  <h2>Face Recognize App</h2>

  <!-- ★ 音声解除ボタン（スマホ必須） -->
  <button id="startButton">▶ タップして開始</button>

  <div class="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">モデル読み込み中...</div>
  <div id="popup"></div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const statusDiv = document.getElementById("status");
    const popup = document.getElementById("popup");
    const startButton = document.getElementById("startButton");

    let refRyo = null, refTowa = null;

    /* ==========================================================
        ◆ 1. サウンド（Base64）
    ========================================================== */

    const soundGood = new Audio(
      "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA..."
    );

    const soundBad = new Audio(
      "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQB..."
    );

    /* ---- スマホ音声ロック解除 ---- */
    startButton.addEventListener("click", () => {
      soundGood.play().catch(()=>{});
      soundBad.play().catch(()=>{});
      video.muted = false;

      startButton.style.display = "none";
    });

    let lastSoundTime = 0;
    function playSound(type) {
      const now = Date.now();
      if (now - lastSoundTime < 1000) return;
      lastSoundTime = now;

      if (type === "good") soundGood.play();
      if (type === "bad") soundBad.play();
    }

    /* ==========================================================
        ◆ 2. トラッキング
    ========================================================== */
    let trackIdCounter = 0;
    const tracks = [];

    function assignTrack(x, y) {
      let best = null;
      let bestDist = 9999;

      tracks.forEach(t => {
        const d = Math.hypot(t.x - x, t.y - y);
        if (d < bestDist && d < 85) {
          bestDist = d;
          best = t;
        }
      });

      if (best) {
        best.x = x;
        best.y = y;
        best.lastSeen = Date.now();
        return best.id;
      } else {
        const newTrack = {
          id: ++trackIdCounter,
          x, y,
          lastSeen: Date.now()
        };
        tracks.push(newTrack);
        return newTrack.id;
      }
    }

    function cleanupTracks() {
      const now = Date.now();
      for (let i = tracks.length - 1; i >= 0; i--) {
        if (now - tracks[i].lastSeen > 5000) {
          tracks.splice(i, 1);
        }
      }
    }

    /* ==========================================================
        ◆ 3. カメラ起動
    ========================================================== */
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;

      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    /* ==========================================================
        ◆ 4. face-api モデルロード
    ========================================================== */
    async function loadAll() {
      statusDiv.textContent = "モデル読み込み中...";

      await faceapi.nets.ssdMobilenetv1.loadFromUri("./models");
      await faceapi.nets.faceLandmark68Net.loadFromUri("./models");
      await faceapi.nets.faceRecognitionNet.loadFromUri("./models");

      refRyo = await (await fetch("ryo.json")).json();
      refTowa = await (await fetch("toto.json")).json();

      statusDiv.textContent = "カメラ起動中...";
    }

    function distance(a, b) {
      return Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
    }

    /* ==========================================================
        ◆ 5. ポップアップ
    ========================================================== */
    function showPopup(text) {
      popup.textContent = text;
      popup.classList.add("active");
      setTimeout(() => popup.classList.remove("active"), 1300);
    }

    /* ==========================================================
        ◆ 6. メインループ
    ========================================================== */
    let lastSeenAnyone = Date.now();
    const unknownMessages = ["誰！？", "初めまして？", "新キャラ登場？", "知らない人だ…"];

    async function recognizeLoop() {
      const detections = await faceapi
        .detectAllFaces(video)
        .withFaceLandmarks()
        .withFaceDescriptors();

      cleanupTracks();

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;

      ctx.clearRect(0, 0, overlay.width, overlay.height);

      // canvas反転
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-overlay.width, 0);

      let foundRyo = false;
      let foundTowa = false;

      detections.forEach(det => {
        const box = det.detection.box;

        /* 🔥 座標反転補正 */
        const flipX = overlay.width - (box.x + box.width);
        const drawX = flipX;
        const drawY = box.y;

        /* トラッキングも反転座標で */
        const cx = drawX + box.width / 2;
        const cy = drawY + box.height / 2;
        const id = assignTrack(cx, cy);

        const desc = Array.from(det.descriptor);
        const dR = distance(desc, refRyo);
        const dT = distance(desc, refTowa);

        let label = "";
        let color = "";

        if (dR < 0.35) {
          label = "ryo";
          color = "blue";
          foundRyo = true;
        } else if (dT < 0.35) {
          label = "towa";
          color = "green";
          foundTowa = true;
        } else {
          label = "？" + id;
          color = "gray";
        }

        ctx.lineWidth = 4;
        ctx.strokeStyle = color;
        ctx.strokeRect(drawX, drawY, box.width, box.height);

        ctx.fillStyle = color;
        ctx.font = "24px sans-serif";
        ctx.fillText(label, drawX + 5, drawY - 8);
      });

      ctx.restore();

      /* ---- 見失い確認 ---- */
      const now = Date.now();
      if (detections.length > 0) lastSeenAnyone = now;

      /* ---- 判定 ---- */
      let msg = "";
      let color = "";

      if (foundRyo && foundTowa) {
        msg = "💚 お似合いカップル！";
        color = "green";
        showPopup(msg);
        playSound("good");

        document.body.classList.add("love");
        setTimeout(() => document.body.classList.remove("love"), 1100);
      }
      else if (detections.length === 0 && now - lastSeenAnyone > 3000) {
        msg = "見失った…";
        color = "orange";
        playSound("bad");
      }
      else if (!foundRyo && !foundTowa && detections.length > 0) {
        msg = unknownMessages[Math.floor(Math.random() * unknownMessages.length)];
        color = "gray";
        playSound("bad");
      }
      else if (foundRyo && !foundTowa) {
        msg = "あと とわ！";
        color = "blue";
      }
      else if (!foundRyo && foundTowa) {
        msg = "あと りょう！";
        color = "green";
      }

      statusDiv.innerHTML = `<span style="color:${color}">${msg}</span>`;

      requestAnimationFrame(recognizeLoop);
    }

    /* ==========================================================
        ◆ 7. 初期化
    ========================================================== */
    (async () => {
      await loadAll();
      await setupCamera();
      statusDiv.textContent = "解析開始...";
      recognizeLoop();
    })();
  </script>

</body>
</html>
