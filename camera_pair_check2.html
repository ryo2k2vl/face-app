<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Face Recognize App (Final + Pinpon)</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      text-align: center;
      background: #ffeaea;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      transition: background 0.5s;
    }

    body.love {
      animation: glow 1.2s ease-out forwards;
    }
    @keyframes glow {
      0% { background: #ffeaea; }
      50% { background: #ffb3d9; }
      100% { background: #ffeaea; }
    }

    h2 {
      margin-top: 10px;
      font-size: 1.6em;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 10px auto;
    }

    video, canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #status {
      font-size: 1.4em;
      min-height: 1.4em;
      margin-top: 8px;
    }

    #popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      padding: 20px 40px;
      font-size: 2em;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(0,0,0,0.2);
      opacity: 0;
      transition: transform 0.35s ease-out, opacity 0.35s;
      pointer-events: none;
      z-index: 9999;
    }

    #popup.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    #startButton {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8em;
      padding: 18px 36px;
      z-index: 99999;
      background: #ff8a8a;
      color: white;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <h2>Face Recognize App</h2>

  <button id="startButton">▶ タップして開始</button>

  <div class="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">モデル読み込み中...</div>
  <div id="popup"></div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const statusDiv = document.getElementById("status");
    const popup = document.getElementById("popup");
    const startButton = document.getElementById("startButton");

    let refRyo = null, refTowa = null;

    /* ==========================================
        1. サウンド読み込み
    ========================================== */
    const soundGood = new Audio("data:audio/mp3;base64,//uQxAAAA...");
    const soundBad  = new Audio("data:audio/mp3;base64,//uQxAAAA...");
    const soundPinpon = new Audio("sound/pinpon.mp3");  // ⭐追加

    startButton.addEventListener("click", () => {
      soundPinpon.play().catch(()=>{}); // 一度だけ再生して権限解放
      video.muted = false;
      startButton.style.display = "none";
    });

    let lastState = "none";
    let cooldown = false;

    function startCooldown() {
      cooldown = true;
      setTimeout(() => cooldown = false, 5000); // 5秒ロック
    }

    /* ==========================================
        2. トラッキング
    ========================================== */
    let trackIdCounter = 0;
    const tracks = [];

    function assignTrack(x, y) {
      let best = null, bestDist = 9999;
      tracks.forEach(t => {
        const d = Math.hypot(t.x - x, t.y - y);
        if (d < bestDist && d < 85) { bestDist = d; best = t; }
      });
      if (best) {
        best.x = x; best.y = y; best.lastSeen = Date.now();
        return best.id;
      }
      const nt = {id: ++trackIdCounter, x, y, lastSeen: Date.now()};
      tracks.push(nt);
      return nt.id;
    }

    function cleanupTracks() {
      const now = Date.now();
      for (let i = tracks.length - 1; i >= 0; i--) {
        if (now - tracks[i].lastSeen > 5000) tracks.splice(i, 1);
      }
    }

    /* ==========================================
        3. カメラ起動
    ========================================== */
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;

      return new Promise(resolve => {
        video.onloadedmetadata = () => { video.play(); resolve(); };
      });
    }

    /* ==========================================
        4. モデル読み込み
    ========================================== */
    async function loadAll() {
      statusDiv.textContent = "モデル読み込み中...";
      await faceapi.nets.ssdMobilenetv1.loadFromUri("./models");
      await faceapi.nets.faceLandmark68Net.loadFromUri("./models");
      await faceapi.nets.faceRecognitionNet.loadFromUri("./models");
      refRyo = await (await fetch("ryo.json")).json();
      refTowa = await (await fetch("toto.json")).json();
      statusDiv.textContent = "カメラ起動中...";
    }

    function distance(a, b) {
      return Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
    }

    function showPopup(text) {
      popup.textContent = text;
      popup.classList.add("active");
      setTimeout(() => popup.classList.remove("active"), 1300);
    }

    /* ==========================================
        5. 認識ループ
    ========================================== */
    let lastSeenAnyone = Date.now();
    const unknownMessages = ["誰！？", "新キャラ登場？", "知らない人だ…"];

    async function recognizeLoop() {

      if (cooldown) {
        await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
        return requestAnimationFrame(recognizeLoop);
      }

      const detections = await faceapi
        .detectAllFaces(video)
        .withFaceLandmarks()
        .withFaceDescriptors();

      cleanupTracks();

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;

      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-overlay.width, 0);

      let foundRyo = false;
      let foundTowa = false;

      detections.forEach(det => {
        const box = det.detection.box;

        const drawX = overlay.width - (box.x + box.width);
        const drawY = box.y;

        const cx = drawX + box.width / 2;
        const cy = drawY + box.height / 2;

        const id = assignTrack(cx, cy);

        const desc = Array.from(det.descriptor);
        const dR = distance(desc, refRyo);
        const dT = distance(desc, refTowa);

        let label="", color="";

        if (dR < 0.35) { label="ryo";  color="blue";  foundRyo = true; }
        else if (dT < 0.35) { label="towa"; color="green"; foundTowa = true; }
        else { label="？"+id; color="gray"; }

        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.strokeRect(drawX, drawY, box.width, box.height);

        ctx.fillStyle = color;
        ctx.font = "24px sans-serif";
        ctx.fillText(label, drawX + 5, drawY - 8);
      });

      ctx.restore();

      /* 状態遷移 */
      const now = Date.now();
      let state = "";

      if (foundRyo && foundTowa) state = "couple";
      else if (detections.length === 0 && now - lastSeenAnyone > 3000) state = "lost";
      else if (!foundRyo && !foundTowa && detections.length > 0) state = "unknown";
      else if (foundRyo && !foundTowa) state = "need_towa";
      else if (!foundRyo && foundTowa) state = "need_ryo";

      if (detections.length > 0) lastSeenAnyone = now;

      /* 状態が変わったときだけ実行 */
      if (state !== lastState) {

        switch (state) {

          case "couple":
            startCooldown();
            showPopup("💚 お似合いカップル！");
            soundPinpon.play();   // 💚⭐ pinpon.mp3 再生
            document.body.classList.add("love");
            setTimeout(() => document.body.classList.remove("love"), 1100);
            statusDiv.innerHTML = `<span style="color:green">💚 お似合いカップル！</span>`;
            break;

          case "lost":
            startCooldown();
            statusDiv.innerHTML = `<span style="color:orange">見失った…</span>`;
            soundBad.play();
            break;

          case "unknown":
            startCooldown();
            const m = unknownMessages[Math.floor(Math.random()*unknownMessages.length)];
            statusDiv.innerHTML = `<span style="color:gray">${m}</span>`;
            soundBad.play();
            break;

          case "need_towa":
            startCooldown();
            statusDiv.innerHTML = `<span style="color:blue">あと とわ！</span>`;
            break;

          case "need_ryo":
            startCooldown();
            statusDiv.innerHTML = `<span style="color:green">あと りょう！</span>`;
            break;
        }
      }

      lastState = state;

      requestAnimationFrame(recognizeLoop);
    }

    /* ==========================================
        6. 初期化
    ========================================== */
    (async () => {
      await loadAll();
      await setupCamera();
      statusDiv.textContent = "解析開始...";
      recognizeLoop();
    })();
  </script>
</body>
</html>
