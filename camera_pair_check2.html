<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Face Recognize App (Stable Final)</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      text-align: center;
      background: #ffeaea;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      transition: background 0.4s;
    }

    /* 一度だけ使う濃いピンク背景 */
    body.love-fixed {
      background: #ff7fc9 !important;
    }

    h2 {
      margin-top: 10px;
      font-size: 1.6em;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 10px auto;
    }

    video, canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #status {
      font-size: 1.4em;
      min-height: 1.4em;
      margin-top: 8px;
      transition: all 0.3s;
    }

    #popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 22px 40px;
      font-size: 2.2em;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      border: 2px solid rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 9999;
    }

    #popup.show {
      opacity: 1;
    }

    /* スタートボタン */
    #startButton {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8em;
      padding: 18px 36px;
      z-index: 99999;
      background: #ff8a8a;
      color: white;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <h2>Face Recognize App</h2>

  <button id="startButton">▶ タップして開始</button>

  <div class="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">モデル読み込み中...</div>
  <div id="popup"></div>

  <script>

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const statusDiv = document.getElementById("status");
    const popup = document.getElementById("popup");
    const startButton = document.getElementById("startButton");

    let refRyo = null, refTowa = null;

    /* ==========================================================
        1. 音声 (pinpon)
    ========================================================== */

    // ⭐ユーザー操作で許可を得る必要があるので1回だけ play() する
    const pinpon = new Audio("sounds/pinpon.mp3");
    pinpon.preload = "auto";

    startButton.addEventListener("click", () => {
      pinpon.play().catch(()=>{}); // 許可用ダミー (音はほぼ聞こえない)
      pinpon.pause();
      pinpon.currentTime = 0;

      video.muted = false;
      startButton.style.display = "none";
    });


    /* ==========================================================
        2. 状態管理（チカチカ防止 & 5秒ロック）
    ========================================================== */

    let lastState = "none";
    let cooldown = false;

    function startCooldown() {
      cooldown = true;

      // 5秒後に解除
      setTimeout(() => {
        cooldown = false;
        document.body.classList.remove("love-fixed");
      }, 5000);
    }

    /* ==========================================================
        3. トラッキング
    ========================================================== */

    let trackIdCounter = 0;
    const tracks = [];

    function assignTrack(x, y) {
      let best = null, bestDist = 9999;

      tracks.forEach(t => {
        const d = Math.hypot(t.x - x, t.y - y);
        if (d < bestDist && d < 85) { bestDist = d; best = t; }
      });

      if (best) {
        best.x = x; best.y = y; best.lastSeen = Date.now();
        return best.id;
      }

      const nt = { id: ++trackIdCounter, x, y, lastSeen: Date.now() };
      tracks.push(nt);
      return nt.id;
    }

    function cleanupTracks() {
      const now = Date.now();
      for (let i = tracks.length - 1; i >= 0; i--) {
        if (now - tracks[i].lastSeen > 5000) tracks.splice(i, 1);
      }
    }

    /* ==========================================================
        4. カメラ
    ========================================================== */

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;

      return new Promise(resolve => {
        video.onloadedmetadata = () => { video.play(); resolve(); };
      });
    }

    /* ==========================================================
        5. モデル
    ========================================================== */

    async function loadAll() {
      statusDiv.textContent = "モデル読み込み中...";

      await faceapi.nets.ssdMobilenetv1.loadFromUri("./models");
      await faceapi.nets.faceLandmark68Net.loadFromUri("./models");
      await faceapi.nets.faceRecognitionNet.loadFromUri("./models");

      refRyo = await (await fetch("ryo.json")).json();
      refTowa = await (await fetch("toto.json")).json();

      statusDiv.textContent = "カメラ起動中...";
    }

    function distance(a, b) {
      return Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
    }

    /* ==========================================================
        6. popup
    ========================================================== */

    function showPopup(text) {
      popup.textContent = text;
      popup.classList.add("show");
    }

    function hidePopup() {
      popup.classList.remove("show");
    }

    /* ==========================================================
        7. 認識ループ
    ========================================================== */

    let lastSeen = Date.now();
    const unknownTexts = ["誰！？", "新キャラ？", "知らない人だ…"];

    async function recognizeLoop() {

      if (cooldown) {
        // ロック中は何も変更しない
        return requestAnimationFrame(recognizeLoop);
      }

      const detections = await faceapi
        .detectAllFaces(video)
        .withFaceLandmarks()
        .withFaceDescriptors();

      cleanupTracks();

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;

      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-overlay.width, 0);

      let foundRyo = false;
      let foundTowa = false;

      detections.forEach(det => {
        const b = det.detection.box;

        const drawX = overlay.width - (b.x + b.width);
        const drawY = b.y;

        const cx = drawX + b.width / 2;
        const cy = drawY + b.height / 2;
        const id = assignTrack(cx, cy);

        const desc = Array.from(det.descriptor);
        const dR = distance(desc, refRyo);
        const dT = distance(desc, refTowa);

        let label="", color="";

        if (dR < 0.35) { label="ryo";  color="blue";  foundRyo = true; }
        else if (dT < 0.35) { label="towa"; color="green"; foundTowa = true; }
        else { label="？"+id; color="gray"; }

        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.strokeRect(drawX, drawY, b.width, b.height);

        ctx.fillStyle = color;
        ctx.font = "24px sans-serif";
        ctx.fillText(label, drawX + 5, drawY - 8);
      });

      ctx.restore();

      // 状態決定
      const now = Date.now();
      let state = "";

      if (foundRyo && foundTowa) state = "couple";
      else if (detections.length === 0 && now - lastSeen > 3000) state = "lost";
      else if (!foundRyo && !foundTowa && detections.length > 0) state = "unknown";
      else if (foundRyo && !foundTowa) state = "need_towa";
      else if (!foundRyo && foundTowa) state = "need_ryo";

      if (detections.length > 0) lastSeen = now;

      // 状態が変わった時だけ処理
      if (state !== lastState) {

        switch (state) {

          case "couple":
            startCooldown();
            document.body.classList.add("love-fixed");      // ⭐背景固定
            showPopup("💚 お似合いカップル！");           // ⭐popup固定
            statusDiv.innerHTML = `<span style="color:green">💚 お似合いカップル！</span>`;

            pinpon.currentTime = 0;
            pinpon.play();                                  // ⭐必ず鳴る
            break;

          case "lost":
            startCooldown();
            document.body.classList.add("love-fixed");
            showPopup("見失った…");
            statusDiv.innerHTML = `<span style="color:orange">見失った…</span>`;
            break;

          case "unknown":
            startCooldown();
            document.body.classList.add("love-fixed");
            const msg = unknownTexts[Math.floor(Math.random()*unknownTexts.length)];
            showPopup(msg);
            statusDiv.innerHTML = `<span style="color:gray">${msg}</span>`;
            break;

          case "need_towa":
            startCooldown();
            document.body.classList.add("love-fixed");
            showPopup("あと とわ！");
            statusDiv.innerHTML = `<span style="color:blue">あと とわ！</span>`;
            break;

          case "need_ryo":
            startCooldown();
            document.body.classList.add("love-fixed");
            showPopup("あと りょう！");
            statusDiv.innerHTML = `<span style="color:green">あと りょう！</span>`;
            break;
        }
      }

      lastState = state;
      requestAnimationFrame(recognizeLoop);
    }

    /* ==========================================================
        8. 初期化
    ========================================================== */

    (async () => {
      await loadAll();
      await setupCamera();
      statusDiv.textContent = "解析開始...";
      recognizeLoop();
    })();

  </script>

</body>
</html>
